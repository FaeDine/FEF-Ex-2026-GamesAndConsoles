@if(!!games) {
    <div class="card" style="width: 150px">
        @for(g of games; track g.id) {
            @if(!!g.cover) {
                <img [src]="g.cover" style="height:200px;width:auto">
            }
            <div class="card-body">
                <h5 class="card-title">{{g.name}}</h5>
                <div>
                    <a routerLink="/game/{{g.id}}">
                        {{g.name}} Details</a>
                </div>
            </div>
        }
    </div>
}@else{
    <div>
        No game found.
    </div>
}

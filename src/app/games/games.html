@if(games$ | async; as games) {
    <div class="row justify-content-center">
        @for(g of games; track g.id) {
            <div class="card d-flex flex-column m-1" style="width: 18rem;">
                @if(!!g.cover) {
                    <img [src]="g.cover" class="card-img-top mx-auto d-block pt-5" style="height:200px;width:auto">
                }

                <div class="flex-grow-1 px-3 py-2">
                    <h5 class="card-title">{{g.name}}</h5>
                </div>

                <div class="card-body text-center mt-auto">
                    <a routerLink="/game/{{g.id}}" class="btn btn-primary">{{g.name}} Details</a>
                </div>
            </div>
        }
    </div>
}@else{
    <div class="text-center mt-4">
        <div class="spinner-border"></div>
        <h3>Loading consoles...</h3>
    </div>
}

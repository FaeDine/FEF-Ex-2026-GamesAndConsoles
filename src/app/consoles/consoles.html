@if (consoles$ | async; as consoles) {
<div class="row justify-content-center">
    @for (c of consoles; track c.id) {
        <div class="card d-flex flex-column m-1" style="width: 18rem;">
            @if(!!c.images) {
                <img [src]="c.images[0]" class="card-img-top mx-auto d-block pt-5" style="height:200px;width:auto">
            }

            <div class="flex-grow-1 px-3 py-2">
                <h5 class="card-title">{{c.name}}</h5>
                <p class="card-text">{{c.manufacturer}}</p>
            </div>

            <div class="card-body text-center mt-auto d-grid gap-2">
                <a routerLink="/console/{{c.id}}" class="btn btn-primary">{{c.name}} Details</a>
                <a routerLink="/games/console/{{c.id}}" class="btn btn-outline-primary">Games for {{c.name}}</a>
            </div>
        </div>
    }
</div>
}@else{
    <div class="text-center mt-4">
        <div class="spinner-border"></div>
        <h3>Loading consoles...</h3>
    </div>
}

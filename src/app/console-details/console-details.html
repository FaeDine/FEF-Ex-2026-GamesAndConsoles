@if(!!console){
<div class="d-flex justify-content-center align-items-center">
    <div class="card d-flex flex-column m-1" style="width: 18rem;">
        <div class="flex-grow-1 px-3 py-2">
            <h5 class="card-title">{{console.name}}</h5>
            <p class="card-text">Manufactured by <b>{{console.manufacturer}}</b></p>
            <p class="card-text">Released {{console.releaseDate?.toDateString()}}</p>
        </div>

        <div class="card-body text-center mt-auto">
            @for(img of console.images; track img){
                <img src="{{img}}" style="width:200px;" class="p-3">
            }

            <a routerLink="/games/console/{{console.id}}" class="btn btn-primary">Games for {{console.name}}</a>
        </div>
    </div>
</div>
}@else{
<div class="alert alert-warning mt-3 mx-auto" style="max-width:20rem;">Console not found.</div>
}

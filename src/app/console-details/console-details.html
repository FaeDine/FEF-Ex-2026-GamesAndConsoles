@if(console$ | async; as result){
<div class="d-flex justify-content-center align-items-center">
    <div class="card d-flex flex-column m-1" style="width: 18rem;">
        <div class="flex-grow-1 px-3 py-2">
            <h5 class="card-title">{{result.name}}</h5>
            <p class="card-text">Manufactured by <b>{{result.manufacturer}}</b></p>
            <p class="card-text">Released {{result.releaseDate?.toDateString()}}</p>
        </div>

        <div class="card-body text-center mt-auto">
            @for(img of result.images; track img){
                <img src="{{img}}" style="width:200px;" class="p-3">
            }

            <a routerLink="/games/console/{{result.id}}" class="btn btn-primary">Games for {{result.name}}</a>
        </div>
    </div>
</div>
}@else{
    <div class="text-center mt-4">
        <div class="spinner-border"></div>
        <h3>Loading consoles...</h3>
    </div>
}
